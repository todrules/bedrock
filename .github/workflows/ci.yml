name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Limit default GITHUB_TOKEN permissions to read-only for all jobs.
# Individual jobs that need additional permissions declare them explicitly.
permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  # ─── Backend ────────────────────────────────────────────────────────────────
  backend-lint-build-test:
    name: Backend – Lint, Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test:coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/

  # ─── Frontend ───────────────────────────────────────────────────────────────
  frontend-lint-build-test:
    name: Frontend – Lint, Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:coverage

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://placeholder.execute-api.us-east-1.amazonaws.com/v1
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: us-east-1_placeholder
          NEXT_PUBLIC_COGNITO_CLIENT_ID: placeholder_client_id
          NEXT_PUBLIC_COGNITO_DOMAIN: placeholder.auth.us-east-1.amazoncognito.com
          NEXT_PUBLIC_AWS_REGION: us-east-1

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/

  # ─── Infrastructure ──────────────────────────────────────────────────────────
  infrastructure-lint-build-test:
    name: Infrastructure – Lint, Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: infrastructure

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: infrastructure/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: CDK Synth (dry-run)
        run: npx cdk synth --quiet
        env:
          CDK_DEFAULT_ACCOUNT: '123456789012'
          CDK_DEFAULT_REGION: us-east-1
